<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美甲服務價目表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #D2B48C 0%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 水墨風格碎花裝飾 */
        .flower-decoration {
            position: fixed;
            opacity: 0.15;
            pointer-events: none;
        }

        .flower-1 {
            top: 10%;
            right: 5%;
            font-size: 80px;
            animation: float 6s ease-in-out infinite;
        }

        .flower-2 {
            bottom: 15%;
            right: 3%;
            font-size: 60px;
            animation: float 8s ease-in-out infinite 1s;
        }

        .flower-3 {
            top: 50%;
            left: 2%;
            font-size: 70px;
            animation: float 7s ease-in-out infinite 2s;
        }

        .flower-4 {
            bottom: 20%;
            left: 5%;
            font-size: 50px;
            animation: float 9s ease-in-out infinite 1.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .title {
            text-align: center;
            color: #8B7355;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 輪播容器 */
        .carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .carousel-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
        }

        /* 輪播按鈕 */
        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(139, 115, 85, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s;
            z-index: 5;
        }

        .carousel-button:hover {
            background: rgba(139, 115, 85, 0.9);
        }

        .carousel-button.prev {
            left: 10px;
        }

        .carousel-button.next {
            right: 10px;
        }

        /* 輪播指示器 */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #D2B48C;
            cursor: pointer;
            transition: background 0.3s;
        }

        .indicator.active {
            background: #8B7355;
        }

        /* 滑動提示 */
        .swipe-hint {
            text-align: center;
            color: #A0826D;
            font-size: 12px;
            margin-top: 15px;
            font-style: italic;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 24px;
            }

            .carousel-button {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .flower-1, .flower-2, .flower-3, .flower-4 {
                opacity: 0.08;
            }
        }
    </style>
</head>
<body>
    <!-- 水墨碎花裝飾 -->
    <div class="flower-decoration flower-1">🌸</div>
    <div class="flower-decoration flower-2">🌼</div>
    <div class="flower-decoration flower-3">🌸</div>
    <div class="flower-decoration flower-4">🌼</div>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="title">💅 美甲服務</h1>

        <!-- 輪播 -->
        <div class="carousel">
            <div class="carousel-wrapper" id="carouselWrapper">
                <div class="carousel-item">
                    <img src="E93985B5-D2A5-41AA-AB9D-133B69C3B1DA.png" alt="美甲價目表">
                </div>
                <div class="carousel-item">
                    <img src="IMG_8955.jpeg" alt="預約前須知">
                </div>
            </div>

            <!-- 按鈕 -->
            <button class="carousel-button prev" onclick="prevSlide()">❮</button>
            <button class="carousel-button next" onclick="nextSlide()">❯</button>
        </div>

        <!-- 指示器 -->
        <div class="carousel-indicators">
            <span class="indicator active" onclick="goToSlide(0)"></span>
            <span class="indicator" onclick="goToSlide(1)"></span>
        </div>

        <p class="swipe-hint">← 左滑查看預約須知 →</p>
    </div>

    <script>
        let currentSlide = 0;
        const totalSlides = 2;
        let touchStartX = 0;
        let touchEndX = 0;

        function updateCarousel() {
            const wrapper = document.getElementById('carouselWrapper');
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

            // 更新指示器
            document.querySelectorAll('.indicator').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(n) {
            currentSlide = n;
            updateCarousel();
        }

        // 觸控滑動支援
        const carousel = document.querySelector('.carousel');
        carousel.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        carousel.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextSlide(); // 左滑
                } else {
                    prevSlide(); // 右滑
                }
            }
        }

        // 初始化
        updateCarousel();
    </script>
</body>
</html>
